      <stop offset="0%" stop-color="#1e1e38" />
      <stop offset="60%" stop-color="#0d0e17" />
      <stop offset="100%" stop-color="#07070c" />
    </radialGradient>

    <linearGradient id="plurivexP" x1="100" y1="80" x2="400" y2="440" gradientUnits="userSpaceOnUse">
